<!--
  ===========================================================================
  index.html — Plannova 的唯一页面
  ===========================================================================

  【这个文件干什么】
  只负责"骨架"：告诉浏览器页面上有哪些区域、谁装谁。
  不写任何样式（样式在 css/），不写任何逻辑（逻辑在 js/）。

  【布局方案：B — 三栏 + 可折叠预览抽屉】
  ┌─────────────────────────────────────────────────┐
  │  顶栏 .topbar   （项目名 · 导出 · 主题切换）        │
  ├──────────┬──────────────────────────┬───────────┤
  │ .sidebar │  .editor                 │ .preview  │
  │ 章节导航  │  编辑区                   │ 预览抽屉   │
  │ 240px    │  1fr（自动占满）           │ 48→380px  │
  └──────────┴──────────────────────────┴───────────┘

  【怎么写】
  1. 外层 <div class="app"> 作为 grid 容器，三列由 layout.css 定义
  2. 先写"静态骨架"：把 9 个章节的标题、输入框位置都写死一份
     —— 目的是让页面在没有 JS 时也完整可见，方便调样式
  3. 所有需要 JS 操控的地方，都加 data-* 属性当"钩子"，
     不要用 id 到处抓（见下方命名规约）
  4. <script type="module" src="js/main.js"> 放最后

  【data-* 钩子命名规约 —— 非常重要，你的 JS 全靠它】
    data-action="xxx"   某个可点击的按钮/元素，值是动作名
                        例：data-action="toggle-preview"
                        例：data-action="new-project"
    data-chapter="key"  章节容器，值是章节 key（overview / scope / stack ...）
    data-field="name"   输入控件，值是字段名
                        例：data-field="title"  data-field="positioning"
    data-project-id     当前项目 id（挂在 .app 上）

  【编辑区里每类章节长什么样】
    9 个章节用的控件类型不一样，写的时候要区分：
      - 键值类（项目概览）→ 一行一个 label + input，用 <input>/<textarea>
      - 表格类（需求边界 / 技术选型 / 风险 / 迭代计划）→ 用真正的 <table>
      - 列表类（工程准备 / 测试清单）→ <ul> + 可增删条目
      - 纯文本类（数据结构 / 备忘）→ 一个 <textarea>
    具体字段见 resources/plan.md 每一节的内容。

  【固定行 vs 自由行 —— 写表格和列表前必须先判定】
    同样是"表格"，有两种完全不同的性质，别搞混：

    · 固定行：行数和"行是什么"都由我们定死，用户只能填内容。
      不提供"加一行 / 删一行"按钮，第一列往往是纯文字标签。
      data-field 用点号分层，如 lang.choice / lang.reason
      → 第 3 节 技术选型（语言 / 构建 / 存储 / 样式 / 第三方库）
      → 第 6 节 迭代计划（M1 ~ M6）

    · 自由行：行数和条目都由用户自己增删，每行是一条同类记录。
      需要 data-row-id、data-action="add-row"、"remove-row" 按钮
      → 第 2 节 需求边界（P0 / P1 / 不做，三张表）
      → 第 5 节 难点与风险
      → 第 7 节 工程准备
      → 第 8 节 测试清单（三组）

    判定口诀：这一行的"标题"是用户想的，还是我们预设的？
      预设 → 固定行；用户想的 → 自由行。

  【常见坑】
  - <html lang="zh-CN"> 中间不能有空格（你现在写成了 "zh - CN"，是错的）
  - 三栏要各自滚动，就必须给 html/body/.app/三栏都设 height，
    这条链子写在 layout.css 里，index.html 这边不用管
  - 不要在内联 style 里写颜色，全走 CSS 变量

  【和别的文件的关系】
    css/tokens.css  → 颜色/间距/字号的变量，被下面两个 @import
    css/base.css    → 重置 + 基础排版
    css/layout.css  → 三栏骨架、抽屉过渡、响应式
    js/store.js     → 数据从哪来、存到哪去
    js/render.js    → 数据怎么变成这里写的 HTML
    js/main.js      → 事件绑在这里的元素上
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plannova</title>
</head>
<body>
<div class="app" data-project-id="">
  <header class="topbar">
    <input data-field="title">项目名称</input>
    <button data-action="export">导出</button>
    <button data-action="toggle-theme">主题</button>
  </header>
  <aside class="sidebar">
    <ul class="chapter-nav">
      <li data-action="switch-chapter" data-chapter="overview" class="is-active">1 项目概览</li>
      <li data-action="switch-chapter" data-chapter="scope">2 需求边界</li>
      <li data-action="switch-chapter" data-chapter="stack">3 技术选型</li>
      <li data-action="switch-chapter" data-chapter="model">4 数据结构</li>
      <li data-action="switch-chapter" data-chapter="risk">5 难点与风险</li>
      <li data-action="switch-chapter" data-chapter="plan">6 迭代计划</li>
      <li data-action="switch-chapter" data-chapter="setup">7 工程准备</li>
      <li data-action="switch-chapter" data-chapter="test">8 测试清单</li>
      <li data-action="switch-chapter" data-chapter="notes">9 备忘</li>
    </ul>
  </aside>
  <main class="editor">
    <section data-chapter="overview">
      <h2>1.项目概览</h2>
      <label class="field">
        <span>项目名称</span>
        <input data-field="name" type="text">
      </label>
      <label class="field">
        <span>一句话定位</span>
        <textarea data-field="positioning" rows="2"></textarea>
      </label>
      <label class="field">
        <span>类型</span>
        <select data-field="type">
          <option>课内练习</option>
          <option>简历项目</option>
          <option>个人作品</option>
        </select>
      </label>
      <label class="field">
        <span>完成标准</span>
        <textarea data-field="done" rows="3"></textarea>
      </label>
    </section>

    <section data-chapter="stack">
      <h2>3.技术选型</h2>
      <table data-rows="stack">
        <thead><tr><th>项</th><th>选择</th><th>理由</th></tr></thead>
        <tbody>
          <tr>
            <td>语言</td>
            <td><input data-field="lang.choice"></td>
            <td><input data-field="lang.reason"></td>
          </tr>
          <tr>
            <td>构建</td>
            <td><input data-field="build.choice"></td>
            <td><input data-field="build.reason"></td>
          </tr>
          <tr>
            <td>存储</td>
            <td><input data-field="storage.choice"></td>
            <td><input data-field="storage.reason"></td>
          </tr>
          <tr>
            <td>样式</td>
            <td><input data-field="style.choice"></td>
            <td><input data-field="style.reason"></td>
          </tr>
          <tr>
            <td>第三方库</td>
            <td><input data-field="libs.choice"></td>
            <td><input data-field="libs.reason"></td>
          </tr>
        </tbody>
      </table>
    </section>

    <section data-chapter="model">
      <h2>4.数据结构</h2>
      <label class="field">
        <span>核心数据结构</span>
        <textarea data-field="code" rows="12" spellcheck="false"></textarea>
      </label>
      <label class="field">
        <span>目录结构</span>
        <textarea data-field="directory" rows="12" spellcheck="false"></textarea>
      </label>
      <label class="field">
        <span>数据流向</span>
        <textarea data-field="flow" rows="4"></textarea>
      </label>
    </section>
  </main>
  <aside class="preview">
    <button data-action="toggle-preview" class="preview-handle">预览</button>
    <div class="preview-body"></div>
  </aside>
</div>
</body>
</html>
